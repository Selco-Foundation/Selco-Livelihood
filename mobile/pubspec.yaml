name: livelihood
description: "Livelihood Field Assist UI starter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  badges: 3.1.2
  digit_scanner: 1.0.6+4
  digit_ui_components: 0.2.3+1
  file_picker: 8.0.7
  flutter:
    sdk: flutter
  flutter_bloc: 8.1.6
  google_mlkit_barcode_scanning: 0.12.0
  image_picker: 1.1.2

dependency_overrides:
  camera_android_camerax: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animated_json/
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
    - family: RobotoCondensed
      fonts:
        - asset: assets/fonts/Roboto/RobotoCondensed-Regular.ttf
