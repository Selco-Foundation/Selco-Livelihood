apiVersion: batch/v1
kind: CronJob
metadata:
  name: livelihood-weekly-summary
  namespace: default  # Change to your namespace
spec:
  # Schedule: Monday at 09:00 IST (summary for Mon–Sun week ending previous Sunday)
  # Cron format: minute hour day month day-of-week
  # timeZone: "Asia/Kolkata" handles IST conversion automatically
  schedule: "0 9 * * 1"  # 09:00 IST, Monday
  timeZone: "Asia/Kolkata"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: livelihood-weekly-summary
            image: livelihood-weekly-summary-cron:latest  # Your Docker image
            imagePullPolicy: IfNotPresent
          restartPolicy: OnFailure
